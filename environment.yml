name: qalgos
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python
  - python=3.11
  - pip
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pydantic>=2
  - pandas
  - tqdm
  - sympy
  - networkx
  - pylatexenc
  # Dev
  - pytest
  - ruff
  # C++ toolchain
  - cxx-compiler
  - cmake
  - ninja
  - armadillo
  - yaml-cpp
  # Needed to build the Qiskit C library (scripts/install_qiskit_cpp.sh)
  - rust
  - make
  - git
  # Qiskit (installed from PyPI)
  - pip:
      - qiskit>=2.2,<3
      - qiskit-aer
      - qiskit-ibm-runtime
